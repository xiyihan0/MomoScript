[package]
name = "mmt_rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[lib]
name = "mmt_rs"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
[features]
default = ["native-cli"]
native-cli = [
    "dep:jiff",
    "dep:typst",
    "dep:typst-kit",
    "dep:typst-layout",
    "dep:typst-pdf",
    "dep:ureq",
    "dep:url",
]

[[bin]]
name = "mmt-compile"
path = "src/bin/mmt-compile.rs"
required-features = ["native-cli"]


[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
typst-syntax = "0.15"
time = { version = "0.3.48", features = ["formatting", "parsing"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jiff = { version = "0.2", optional = true }
typst = { version = "0.15", optional = true }
typst-kit = { version = "0.15", default-features = false, features = ["scan-fonts"], optional = true }
typst-layout = { version = "0.15", optional = true }
typst-pdf = { version = "0.15", optional = true }
ureq = { version = "3", optional = true }
url = { version = "2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
